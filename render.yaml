services:
  - type: web
    name: tdscoms-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: triveni_fms
      - key: SEED_DEMO_ACCOUNTS
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.0"
